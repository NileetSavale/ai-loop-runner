name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest backend/tests/ -v

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx tsc --noEmit
        working-directory: frontend

  # ── Build & push Docker images (only on push to main) ─────────────────────
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image prefix
        run: echo "IMG_PREFIX=${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ env.IMG_PREFIX }}/loop-runner-backend:latest,${{ env.IMG_PREFIX }}/loop-runner-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ env.IMG_PREFIX }}/loop-runner-frontend:latest,${{ env.IMG_PREFIX }}/loop-runner-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Kubernetes (only on push to main) ───────────────────────────
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Write kubeconfig
        id: kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "No KUBECONFIG_B64 secret — deploy skipped (no cluster configured)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            mkdir -p ~/.kube
            echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Pin images to the exact commit SHA so rollbacks are deterministic
      - name: Update image tags
        if: steps.kubeconfig.outputs.skip == 'false'
        run: |
          IMG_PREFIX="${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          kubectl set image deployment/backend \
            backend=${IMG_PREFIX}/loop-runner-backend:${{ github.sha }} \
            -n loop-runner
          kubectl set image deployment/frontend \
            frontend=${IMG_PREFIX}/loop-runner-frontend:${{ github.sha }} \
            -n loop-runner

      - name: Apply config changes
        if: steps.kubeconfig.outputs.skip == 'false'
        run: kubectl apply -f k8s/ --recursive -n loop-runner

      - name: Wait for rollout
        if: steps.kubeconfig.outputs.skip == 'false'
        run: |
          kubectl rollout status deployment/backend -n loop-runner --timeout=5m
          kubectl rollout status deployment/frontend -n loop-runner --timeout=5m

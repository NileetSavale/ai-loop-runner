apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: loop-runner
  annotations:
    kubernetes.io/change-cause: "initial deploy"   # shows in rollout history
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1            # one extra pod during rollout
      maxUnavailable: 0      # never take a pod down before a new one is ready
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: loop-runner-sa    # needed for creating K8s Jobs
      containers:
        - name: backend
          image: ghcr.io/YOUR_ORG/loop-runner-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: loop-runner-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loop-runner-secrets
                  key: ANTHROPIC_API_KEY
            - name: VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: loop-runner-secrets
                  key: VAULT_KEY
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: loop-runner-secrets
                  key: SUPABASE_JWT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loop-runner-secrets
                  key: OPENAI_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loop-runner-secrets
                  key: GOOGLE_API_KEY
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loop-runner-secrets
                  key: MISTRAL_API_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loop-runner-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          volumeMounts:
            - name: repos
              mountPath: /repos
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: shared-repos-pvc

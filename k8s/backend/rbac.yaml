apiVersion: v1
kind: ServiceAccount
metadata:
  name: loop-runner-sa
  namespace: loop-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-creator
  namespace: loop-runner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "watch", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-job-creator
  namespace: loop-runner
subjects:
  - kind: ServiceAccount
    name: loop-runner-sa
    namespace: loop-runner
roleRef:
  kind: Role
  name: job-creator
  apiGroup: rbac.authorization.k8s.io

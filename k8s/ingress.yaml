apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loop-runner-ingress
  namespace: loop-runner
  annotations:
    # WebSocket: keep connections open for the duration of a loop run
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # Upgrade header required for WebSocket handshake
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - loop-runner.example.com
      secretName: loop-runner-tls
  rules:
    - host: loop-runner.example.com
      http:
        paths:
          # WebSocket endpoints — must come before the catch-all /api/ rule
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # REST API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Everything else → Next.js
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

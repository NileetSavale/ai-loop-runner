apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: loop-runner
spec:
  serviceName: postgres-service
  replicas: 1                          # single primary — add read replicas later
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: looprunner
            - name: POSTGRES_USER
              value: looprunner
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loop-runner-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "looprunner"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

# DO NOT commit real values. Apply with:
#   kubectl create secret generic loop-runner-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=VAULT_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())") \
#     --from-literal=SUPABASE_JWT_SECRET=... \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=GOOGLE_API_KEY=... \
#     --from-literal=MISTRAL_API_KEY=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     -n loop-runner
apiVersion: v1
kind: Secret
metadata:
  name: loop-runner-secrets
  namespace: loop-runner
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  VAULT_KEY: "REPLACE_ME"
  SUPABASE_JWT_SECRET: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  GOOGLE_API_KEY: "REPLACE_ME"
  MISTRAL_API_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"

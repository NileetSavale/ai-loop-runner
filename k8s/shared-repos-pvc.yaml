apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-repos-pvc
  namespace: loop-runner
spec:
  accessModes:
    - ReadWriteMany          # multiple pods can read/write simultaneously
  resources:
    requests:
      storage: 50Gi
  storageClassName: efs      # AWS EFS on EKS | filestore on GKE | azurefile on AKS
  # For local/minikube testing, use:
  # storageClassName: standard
  # accessModes: [ReadWriteOnce]
